services:
  postgres:
    image: postgres:16
    container_name: ansync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ansync
      POSTGRES_PASSWORD: ansync_dev_password
      POSTGRES_DB: ansync_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ansync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansync -d ansync_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ansync_postgres_data: